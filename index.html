<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Virtual Tour</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>@-ms-viewport { width: device-width; }</style>

  <!-- Styles -->
  <link rel="stylesheet" href="vendor/reset.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
</head>

<body class="multiple-scenes view-control-buttons">

  <!-- ===================== -->
  <!-- INTRO SCREEN -->
  <!-- ===================== -->
  <div id="intro-screen">
    <div id="intro-content">
      <h1>Welcome to the Schöneberg Wild Forest Virtual Tour</h1>
      <p>
        This virtual experience showcases 32 ecological plots with immersive 360° views,
        buffer zones, and access routes.
      </p>

      <button id="start-btn">Start Tour</button>

      <div class="intro-footer">
        This project is funded by the Umweltstiftung Michael Otto
      </div>
    </div>
  </div>

  <!-- ===================== -->
  <!-- MAP VIEW -->
  <!-- ===================== -->
  <div id="map-view">
    <div id="map"></div>
  </div>

  <!-- ===================== -->
  <!-- TOUR VIEW -->
  <!-- ===================== -->
  <div id="tour-view">

    <a href="#" id="backToMapButton" class="map-button">🗺 Map</a>

    <div id="pano"></div>
    <div id="hint">Drag to explore</div>

    <div id="sceneList">
      <ul class="scenes"></ul>
    </div>

    <div id="titleBar">
      <h1 class="sceneName"></h1>
    </div>

    <!-- Controls -->
    <a href="#" id="autorotateToggle">
      <img class="icon off" src="img/play.png">
      <img class="icon on" src="img/pause.png">
    </a>

    <a href="#" id="fullscreenToggle">
      <img class="icon off" src="img/fullscreen.png">
      <img class="icon on" src="img/windowed.png">
    </a>

    <a href="#" id="sceneListToggle">
      <img class="icon off" src="img/expand.png">
      <img class="icon on" src="img/collapse.png">
    </a>

    <!-- View controls -->
    <a href="#" id="viewUp" class="viewControlButton viewControlButton-1"><img src="img/up.png"></a>
    <a href="#" id="viewDown" class="viewControlButton viewControlButton-2"><img src="img/down.png"></a>
    <a href="#" id="viewLeft" class="viewControlButton viewControlButton-3"><img src="img/left.png"></a>
    <a href="#" id="viewRight" class="viewControlButton viewControlButton-4"><img src="img/right.png"></a>
    <a href="#" id="viewIn" class="viewControlButton viewControlButton-5"><img src="img/plus.png"></a>
    <a href="#" id="viewOut" class="viewControlButton viewControlButton-6"><img src="img/minus.png"></a>

  </div>

  <!-- ===================== -->
  <!-- IMAGE OVERLAY -->
  <!-- ===================== -->
  <div id="image-overlay">
    <img id="overlay-img" alt="Preview">
  </div>

  <!-- Logo -->
  <a href="https://abrahamj09.github.io/Schoneberg-Virtual-Tour/" target="_blank">
    <img src="img/logo.png" id="company-logo" alt="Logo">
  </a>

  <!-- ===================== -->
  <!-- LIBS -->
  <!-- ===================== -->
  <script src="vendor/screenfull.min.js" defer></script>
  <script src="vendor/bowser.min.js" defer></script>
  <script src="vendor/marzipano.js" defer></script>

  <!-- DATA + MAIN LOGIC -->
  <script src="data.js" defer></script>
  <script src="index.js" defer></script>

  <!-- ===================== -->
  <!-- APP INIT -->
  <!-- ===================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const intro = document.getElementById("intro-screen");
      const startBtn = document.getElementById("start-btn");
      const pano = document.getElementById("pano");
      const overlay = document.getElementById("image-overlay");

      // ---- START BUTTON ----
      if (startBtn && intro) {
        startBtn.addEventListener("click", () => {
          intro.style.opacity = "0";
          intro.style.pointerEvents = "none";

          setTimeout(() => {
            intro.style.display = "none";
          }, 500);

          if (pano) {
            pano.style.opacity = "1";
          }
        });
      }

      // ---- IMAGE OVERLAY CLOSE ----
      if (overlay) {
        overlay.addEventListener("click", () => {
          overlay.classList.remove("active");
        });
      }

    });
  </script>

</body>
</html>
